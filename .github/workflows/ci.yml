name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.demo }} (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [atlas, todo, tracker, trivia]
        include:
          - test: test
          # tracker keeps the coverage gate its own CI had.
          - demo: tracker
            test: test:coverage
    defaults:
      run:
        working-directory: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ matrix.demo }}/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run ${{ matrix.test }}
      - run: bun run build
      # Build the web client (dist/client) first — the worker dry-run reads it as the ASSETS dir.
      - if: matrix.demo == 'tracker'
        run: bun run build:worker

  deploy-tracker:
    name: Deploy tracker to Cloudflare
    needs: validate
    # Only on a real push to main, and only once the repo variable TRACKER_DEPLOY is "true".
    # It also needs the two Cloudflare secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) and
    # the resources (see tracker/README "Deploy" — d1/kv/r2/queue ids in wrangler.jsonc).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TRACKER_DEPLOY == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: tracker/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply tracker --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker + assets
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
